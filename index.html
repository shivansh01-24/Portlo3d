<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shivansh — Software Engineer</title>
  <meta name="description"
    content="Cinematic 3D portfolio of Shivansh, Software Engineer. Built entirely with procedural Three.js geometry." />
  <style>
    /* Reset — full-viewport canvas with no scrollbars */
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Inter', 'Segoe UI', sans-serif;
      color: #ffffff;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body>
  <!-- Three.js via ES module CDN -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>

  <!-- GSAP for animations -->
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.4/dist/gsap.min.js"></script>

  <!-- Error catcher — shows module load errors on screen -->
  <script>
    window.addEventListener('error', function (e) {
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:10px;left:10px;color:red;font:14px monospace;z-index:99999;background:#000;padding:10px;max-width:90vw;word-wrap:break-word;';
      d.textContent = 'ERROR: ' + e.message + ' | ' + (e.filename || '') + ':' + (e.lineno || '');
      document.body.appendChild(d);
    });
    window.addEventListener('unhandledrejection', function (e) {
      const d = document.createElement('div');
      d.style.cssText = 'position:fixed;top:40px;left:10px;color:orange;font:14px monospace;z-index:99999;background:#000;padding:10px;max-width:90vw;word-wrap:break-word;';
      d.textContent = 'PROMISE REJECT: ' + (e.reason?.message || e.reason || 'unknown');
      document.body.appendChild(d);
    });
  </script>

  <!-- Application entry point -->
  <script type="module" src="./main.js"></script>
</body>

</html>
